name: Publish Baraem web app (iPhone)

# نسخة الويب من التطبيق (للآيفون وأي متصفح) على GitHub Pages:
# https://mhashaad1-sys.github.io/-/
on:
  push:
    branches: ["ccr-2612adaa-cj5fv7"]
    paths: ["nursery/**", ".github/workflows/baraem-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir site
          cp -r nursery/* site/
          rm -f site/README.md
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
