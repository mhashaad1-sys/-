name: Build Nursery Android APK

on:
  push:
    branches: ["ccr-2612adaa-cj5fv7", "main"]
    paths: ["nursery/**", "android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/baraem-release.jks
            echo "Signing with the fixed Baraem key"
            gradle -p android assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk nursery-app.apk
          else
            echo "::warning::KEYSTORE_PASSWORD / KEYSTORE_BASE64 secrets are missing - building a debug APK with a temporary key"
            gradle -p android assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk nursery-app.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nursery-app
          path: nursery-app.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nursery-v${{ github.run_number }}
          name: تطبيق الحضانة - إصدار ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            حمّل ملف nursery-app.apk على الموبايل وافتحه لتثبيت التطبيق.
            (قد يطلب الموبايل السماح بالتثبيت من مصادر غير معروفة.)
          files: nursery-app.apk
          make_latest: true
