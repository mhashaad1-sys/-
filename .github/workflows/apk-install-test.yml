name: Test APK install on Android 15

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        default: nursery-v14
  push:
    branches: ["ccr-2612adaa-cj5fv7"]
    paths: [".github/workflows/apk-install-test.yml"]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        run: |
          TAG="${{ github.event.inputs.tag || 'nursery-v14' }}"
          curl -sSL -o app.apk "https://github.com/${{ github.repository }}/releases/download/$TAG/nursery-app.apk"
          ls -l app.apk

      - name: Inspect APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          $BT/apksigner verify --verbose --print-certs app.apk || true
          $BT/aapt2 dump badging app.apk | head -30 || true
          $BT/zipalign -c -v -p 4 app.apk | tail -5 || true

      - name: Install on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app.apk || adb install -r -t app.apk
            adb shell pm list packages | grep nursery
            adb shell am start -n com.nursery.app/.MainActivity && sleep 8 && adb shell pidof com.nursery.app && adb logcat -d | grep -iE "nursery|AndroidRuntime" | tail -40
