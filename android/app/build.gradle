plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nursery.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nursery.app'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // ملفات التطبيق (HTML/CSS/JS) تُؤخذ مباشرة من مجلد nursery في جذر المستودع
    sourceSets {
        main {
            assets.srcDirs = ['../../nursery']
        }
    }

    // توقيع ثابت: ملف التوقيع وباسورده متخزنين أسرار في GitHub (KEYSTORE_BASE64 و KEYSTORE_PASSWORD)
    def ksPass = System.getenv('KEYSTORE_PASSWORD')
    if (ksPass && !file('../baraem-release.jks').exists()) ksPass = null
    signingConfigs {
        if (ksPass) {
            baraem {
                storeFile file('../baraem-release.jks')
                storePassword ksPass
                keyAlias 'baraem'
                keyPassword ksPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPass) signingConfig signingConfigs.baraem
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
