<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6e">
<title>د. محمد مجدي - جراحة الصدر | إدارة المرضى</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-title">
    <img src="icons/icon.svg" alt="" class="logo">
    <div>
      <h1>د. محمد مجدي</h1>
      <p>استشاري جراحة الصدر</p>
    </div>
  </div>
  <button id="menuBtn" class="icon-btn" title="القائمة" aria-label="القائمة">⋮</button>
  <div id="menuPanel" class="menu-panel hidden">
    <button id="exportBtn">⬇️ تصدير نسخة احتياطية</button>
    <button id="importBtn">⬆️ استيراد نسخة احتياطية</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <button id="printBtn">🖨️ طباعة ملف المريض الحالي</button>
  </div>
</header>

<main id="app">

  <!-- شاشة قائمة المرضى -->
  <section id="listView" class="view">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="بحث باسم المريض...">
      <button id="addPatientBtn" class="primary-btn">+ مريض جديد</button>
    </div>
    <div id="patientList" class="patient-list"></div>
    <p id="emptyState" class="empty-state hidden">لا يوجد مرضى مسجلين بعد. اضغط "مريض جديد" للبدء.</p>
  </section>

  <!-- شاشة تفاصيل / تحرير المريض -->
  <section id="detailView" class="view hidden">
    <button id="backBtn" class="back-btn">→ رجوع لقائمة المرضى</button>

    <div class="card">
      <h2 class="section-title">البيانات الأساسية</h2>
      <div class="form-grid">
        <label>اسم المريض
          <input type="text" id="fName" required>
        </label>
        <label>السن
          <input type="number" id="fAge" min="0" max="120">
        </label>
        <label>النوع
          <select id="fGender">
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </label>
        <label>رقم الهاتف
          <input type="tel" id="fPhone">
        </label>
        <label>العنوان
          <input type="text" id="fAddress">
        </label>
        <label>الرقم القومي / رقم الملف
          <input type="text" id="fNationalId">
        </label>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">التاريخ المرضي</h2>
      <div class="form-grid">
        <label>الأمراض المزمنة (سكر، ضغط، قلب...)
          <textarea id="fChronic" rows="2"></textarea>
        </label>
        <label>الحساسية من أدوية
          <textarea id="fAllergies" rows="2"></textarea>
        </label>
        <label>الأدوية الحالية
          <textarea id="fMeds" rows="2"></textarea>
        </label>
        <label>عمليات جراحية سابقة
          <textarea id="fPrevSurgeries" rows="2"></textarea>
        </label>
        <label>التدخين
          <select id="fSmoking">
            <option value="لا">غير مدخن</option>
            <option value="نعم">مدخن حاليًا</option>
            <option value="سابقا">مدخن سابق</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">الشكوى الحالية والفحص</h2>
      <label>الأعراض / الشكوى
        <textarea id="fComplaint" rows="3" placeholder="مثال: ألم صدر، سعال، ضيق نفس، نفث دم..."></textarea>
      </label>
      <div id="suggestionBox" class="suggestion-box hidden">
        <div class="suggestion-title">💡 اقتراحات مبدئية (تحتاج تقييم الطبيب ولا تغني عن الفحص الإكلينيكي)</div>
        <div id="suggestionChips" class="chips"></div>
      </div>
      <label>التشخيص / الخطة العلاجية
        <textarea id="fDiagnosis" rows="3"></textarea>
      </label>
      <label>ملاحظات الطبيب
        <textarea id="fNotes" rows="2"></textarea>
      </label>
    </div>

    <div class="card">
      <h2 class="section-title">الأشعة والصور الطبية</h2>
      <div class="image-upload-row">
        <select id="fImgType">
          <option>أشعة عادية (X-Ray)</option>
          <option>أشعة مقطعية (CT)</option>
          <option>رنين مغناطيسي (MRI)</option>
          <option>سونار</option>
          <option>تقرير / نتيجة تحليل</option>
          <option>أخرى</option>
        </select>
        <input type="file" id="fImgFile" accept="image/*,application/pdf" capture="environment">
      </div>
      <div id="imageGrid" class="image-grid"></div>
    </div>

    <div class="save-bar">
      <button id="deletePatientBtn" class="danger-btn">حذف المريض</button>
      <button id="savePatientBtn" class="primary-btn">💾 حفظ البيانات</button>
    </div>
  </section>

</main>

<div id="lightbox" class="lightbox hidden">
  <button id="lightboxClose" class="lightbox-close">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
